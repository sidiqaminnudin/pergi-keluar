<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operasional TL - PERGI KELUAR</title><style>*{box-sizing:border-box}body{font:16px/1.5 system-ui,sans-serif;margin:0;background:#f5f7f8;color:#17202a}.wrap{max-width:760px;margin:auto;padding:22px 16px}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0001}input,select,button{font:inherit;padding:12px;border:1px solid #ddd;border-radius:9px;margin:5px 0}input,select{width:100%}button{background:#f45b17;color:white;border:0;font-weight:700;cursor:pointer;width:100%}button.secondary{background:#374151}.muted{color:#667085}.hidden{display:none}.trip{border:1px solid #eee;padding:14px;border-radius:12px;margin:10px 0}label{display:block;margin:8px 0 4px;font-weight:600}h1{color:#f45b17}select{background:#fff}</style></head><body><main class="wrap"><h1>PERGI KELUAR &middot; TL</h1><p class="muted">Operasional perjalanan melalui browser. GPS hanya aktif saat halaman ini terbuka.</p><section id="login" class="card"><h2>Login TL</h2><form id="loginForm"><label>Email<input name="email" type="email" placeholder="tl@example.com" required></label><label>Password<input name="password" type="password" required></label><button type="submit">Masuk</button></form></section><section id="app" class="hidden"><button id="logout" class="secondary">Keluar</button><div id="trips"></div><div id="active"></div></section><p id="loginMsg" role="status" aria-live="polite"></p></main><script src="/assets/tl.js"></script></body></html>
