<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Tracking - PERGI KELUAR</title>
<style>:root{font-family:Inter,system-ui,sans-serif;color:#17202a;background:#f5f7f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:auto;padding:28px 18px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.brand{font-weight:800;color:#f45b17}.muted{color:#6b7280}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 8px 24px #17202a0d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.stat{padding:16px;border-radius:14px;background:#f8fafc}.value{font-weight:800;font-size:1.35rem;margin-top:5px}.ok{color:#16803c}.warn{color:#b45309}.slide{display:none;min-height:390px;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#17202a,#374151);color:#fff;border-radius:24px;padding:42px}.slide.active{display:flex}.slide h1{font-size:clamp(2rem,6vw,4.8rem);margin:12px 0}.slide p{font-size:1.2rem}.dots{text-align:center;padding:15px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#cbd5e1;margin:4px}.dot.active{background:#f45b17}.hidden{display:none}.live-map{margin-top:18px;overflow:hidden;border-radius:16px;background:#17202a}.map-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;color:#fff}.map-head h2{margin:0;font-size:1.1rem}.map-head p{margin:4px 0 0;color:#cbd5e1;font-size:.82rem}.map-link{color:#fff;background:#f45b17;padding:9px 12px;border-radius:9px;font-size:.8rem;font-weight:700;white-space:nowrap}.live-map iframe{display:block;width:100%;height:370px;border:0}.map-empty{padding:34px 22px;color:#cbd5e1;text-align:center;background:linear-gradient(135deg,#17202a,#374151)}.checkpoint-list{display:grid;gap:8px;margin-top:14px}.checkpoint-item{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid #e5e7eb;border-radius:12px}.checkpoint-number{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:#fff0e8;color:#f45b17;font-weight:800;flex:none}.checkpoint-item b{display:block}.checkpoint-item small{color:#6b7280}.checkpoint-item.done .checkpoint-number{background:#dcfce7;color:#16803c}.checkpoint-item.current{border-color:#f45b17;box-shadow:0 0 0 2px #f45b1720}@media(max-width:560px){.map-head{align-items:flex-start;flex-direction:column}.map-link{width:100%;text-align:center}.live-map iframe{height:300px}}</style><link rel="stylesheet" href="/assets/live.css"></head>
<body><div class="wrap"><div class="bar"><div class="brand">PERGI KELUAR</div><div id="mode" class="muted"></div></div>
<section id="live" class="card"><h1 id="title">Memuat...</h1><p id="message" class="muted">Menghubungkan ke server...</p>
<div class="grid"><div class="stat">Status<div id="status" class="value">-</div></div><div class="stat">Kesegaran data<div id="fresh" class="value">-</div></div><div class="stat">Checkpoint<div id="checkpoint" class="value">0</div></div><div class="stat">Akurasi lokasi<div id="location" class="value">Disembunyikan</div></div></div><div id="liveMap"></div><div id="checkpoints"></div></section>
<section id="slides" class="hidden"></section><div id="dots" class="dots hidden"></div></div>
<script>
const esc=v=>String(v||'').replace(/[&<>"\x27]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\x27":"&#39;"}[c]));
const params=new URLSearchParams(location.search);
const key=params.get("slug")||params.get("token");
const liveUrl=params.get("token")?`/api/public/private-trips/${encodeURIComponent(key)}/live`:`/api/public/trips/${encodeURIComponent(key||'')}/live`;
let lastLive=null,lastMapKey='',lastPos=null,lastSpeedKmh=0;
function calcSpeed(lat,lng,ts){
 if(!Number.isFinite(ts))return lastSpeedKmh;
 if(lastPos&&(lastPos.lat!==lat||lastPos.lng!==lng)&&ts>lastPos.ts){
  const R=6371000,toRad=x=>x*Math.PI/180,dLat=toRad(lat-lastPos.lat),dLng=toRad(lng-lastPos.lng);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lastPos.lat))*Math.cos(toRad(lat))*Math.sin(dLng/2)**2;
  const dist=2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)),dt=(ts-lastPos.ts)/1000;
  if(dt>0)lastSpeedKmh=Math.min(140,Math.round((dist/dt)*3.6));
 }
 if(!lastPos||lastPos.lat!==lat||lastPos.lng!==lng)lastPos={lat,lng,ts};
 return lastSpeedKmh;
}
function fmtAge(age){if(!Number.isFinite(age)||age<15000)return 'Baru saja';if(age<60000)return Math.floor(age/1000)+' detik yang lalu';return Math.floor(age/60000)+' menit yang lalu';}
function renderMap(d){
 const ts=Date.parse(d.lastLocationAt),age=Date.now()-ts,p=d.location;
 const valid=d.status==='active'&&Number.isFinite(age)&&age>=0&&age<120000&&p&&p.latitude!==null&&p.longitude!==null&&Number.isFinite(Number(p.latitude))&&Number.isFinite(Number(p.longitude))&&Math.abs(Number(p.latitude))<=90&&Math.abs(Number(p.longitude))<=180;
 const root=document.querySelector('#liveMap');
 if(!valid){lastMapKey='';root.innerHTML='<div class="live-map"><div class="map-empty">Lokasi tidak tersedia atau tidak sedang dibagikan. Peta hanya ditampilkan saat lokasi terkini masih segar.</div></div>';document.querySelector('#location').textContent='Disembunyikan';document.querySelector('#fresh').textContent=d.status==='completed'?'Selesai':'Lokasi tidak tersedia';document.querySelector('#fresh').className='value warn';return;}
 const lat=Number(p.latitude),lng=Number(p.longitude),coords=lat+','+lng;
 const acc=Number.isFinite(Number(p.accuracyMeters))&&p.accuracyMeters!==null?Math.round(Number(p.accuracyMeters))+'m':'N/A';
 const cp=Array.isArray(d.checkpoints)?d.checkpoints[d.currentCheckpoint]:null;
 const arrived=cp&&cp.status==='arrived';
 const speed=calcSpeed(lat,lng,ts);
 const statusText=arrived?'Di Checkpoint':'Bergerak';
 const speedText=arrived?'0 km/jam':(speed>0?speed+' km/jam':'Live GPS');
 if(lastMapKey!==coords){lastMapKey=coords;root.innerHTML='<div class="live-map"><div class="map-head"><div><h2>Lokasi Terkini</h2><p>Lokasi terakhir yang dibagikan, bukan jejak perjalanan.</p></div><a class="map-link" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(coords)+'">Buka Google Maps ↗</a></div><div class="map-stage"><iframe title="Lokasi terkini" referrerpolicy="no-referrer" allowfullscreen src="https://maps.google.com/maps?output=embed&hl=id&t=m&z=15&q='+encodeURIComponent(coords)+'"></iframe><div class="map-vignette" aria-hidden="true"></div><div class="map-car-marker" aria-hidden="true"><span class="map-car-pulse"></span><span class="map-car-pulse delay"></span><div class="map-car-pin"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg></div></div><div class="map-hud map-hud-left"><div class="map-hud-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg><span class="map-hud-dot"></span></div><div class="map-hud-row"><span>Status:</span> <b id="mapHudStatus">'+esc(statusText)+'</b></div><div class="map-hud-row"><span>Kecepatan:</span> <b id="mapHudSpeed">'+esc(speedText)+'</b></div><div class="map-hud-row"><span>Akurasi:</span> <b id="mapHudAcc">'+esc(acc)+'</b></div></div><div class="map-hud map-hud-right"><div class="map-hud-badge" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="10" y1="7" x2="10" y2="17"/><line x1="14" y1="7" x2="14" y2="17"/></svg></div><div class="map-hud-label">Terakhir diperbarui:</div><div class="map-hud-time" id="mapHudAge">'+esc(fmtAge(age))+'</div></div></div></div>';}
 document.querySelector('#mapHudStatus').textContent=statusText;
 document.querySelector('#mapHudSpeed').textContent=speedText;
 document.querySelector('#mapHudAcc').textContent=acc;
 document.querySelector('#mapHudAge').textContent=fmtAge(age);
 document.querySelector('#location').textContent='± '+(Number.isFinite(Number(p.accuracyMeters))&&p.accuracyMeters!==null?Math.round(Number(p.accuracyMeters))+' m':'akurasi tidak tersedia');
 document.querySelector('#fresh').textContent='Live';document.querySelector('#fresh').className='value ok';
}
function renderCheckpoints(d){const items=Array.isArray(d.checkpoints)?d.checkpoints:[],labels={upcoming:'Menunggu',arrived:'Sudah tiba',departed:'Sudah berangkat',skipped:'Dilewati'};document.querySelector('#checkpoint').textContent=items.filter(c=>c.status==='departed'||c.status==='skipped').length+' / '+items.length;document.querySelector('#checkpoints').innerHTML='<h2>Progres perjalanan</h2><div class="checkpoint-list">'+(items.map((c,i)=>'<div class="checkpoint-item '+(['departed','skipped'].includes(c.status)?'done':'')+(d.status==='active'&&i===d.currentCheckpoint?' current':'')+'"><span class="checkpoint-number">'+(i+1)+'</span><div><b>'+esc(c.label||'Checkpoint '+(i+1))+'</b><small>'+esc(labels[c.status]||'Menunggu')+'</small></div></div>').join('')||'<p class="muted">Belum ada checkpoint.</p>')+'</div>';}
function renderLiveModern(d){lastLive=d;const stale=d.status!=="active"||!d.lastLocationAt||Date.now()-Date.parse(d.lastLocationAt)>120000;document.querySelector("#title").textContent=d.title||"Live tracking";document.querySelector("#status").textContent=({active:'Dalam perjalanan',completed:'Selesai',stopped:'Dihentikan',not_started:'Belum dimulai'})[d.status]||'Belum tersedia';document.querySelector("#status").className="value "+(d.status==="active"&&!stale?"ok":"warn");document.querySelector("#fresh").textContent=stale?(d.status==="completed"?"Selesai":"Tidak ada update baru"):"Live";document.querySelector("#fresh").className="value "+(stale?"warn":"ok");document.querySelector("#checkpoint").textContent=(d.checkpoints||[]).map((c,i)=>(i+1)+". "+c.label+" — "+c.status).join("; ")||"Belum ada checkpoint";document.querySelector("#location").textContent=d.location?d.location.latitude+", "+d.location.longitude+" +-"+d.location.accuracyMeters+"m":"Disembunyikan";document.querySelector("#message").textContent=d.lastLocationAt?"Update terakhir: "+new Date(d.lastLocationAt).toLocaleString("id-ID"):"Belum ada lokasi diterima"}
function renderLive(d){renderLiveModern(d);renderMap(d);renderCheckpoints(d);}
setInterval(()=>{if(lastLive)renderMap(lastLive)},1000);
function showError(e){lastLive=null;lastMapKey='';document.querySelector('#liveMap').innerHTML='<div class="map-empty">Koneksi terputus — lokasi disembunyikan sampai tersambung kembali.</div>';document.querySelector('#status').className='value warn';document.querySelector('#fresh').className='value warn';document.querySelector("#fresh").textContent="Tidak tersambung";document.querySelector("#location").textContent="Tidak tersedia";document.querySelector("#title").textContent="Live tracking tidak tersedia";document.querySelector("#message").textContent=e.message||"Trip tidak ditemukan"}
if(location.pathname==="/live"){document.querySelector("#mode").textContent="LIVE";function poll(){fetch(liveUrl).then(r=>r.ok?r.json():Promise.reject(new Error("Trip tidak ditemukan"))).then(renderLive).catch(showError)}poll();setInterval(poll,10000)}else{document.querySelector("#mode").textContent="SLIDESHOW";document.querySelector("#live").classList.add("hidden");fetch("/api/public/trips").then(r=>r.json()).then(ts=>{const root=document.querySelector("#slides");root.classList.remove("hidden");if(!ts.length){root.innerHTML="<div class=card>Belum ada trip published.</div>";return}root.innerHTML=ts.map((t,i)=>"<article class=\"slide "+(i===0?"active":"")+"\"><div><div class=muted>"+esc(t.location||"PERGI KELUAR")+"</div><h1>"+esc(t.title)+"</h1><p>"+esc(t.subtitle||t.description||"Informasi perjalanan")+"</p><p>"+esc(t.start_date||"Jadwal menyusul")+" "+(t.end_date?"- "+esc(t.end_date):"")+"</p></div></article>").join("");document.querySelector("#dots").classList.remove("hidden");document.querySelector("#dots").innerHTML=ts.map(function(_,i){return "<span class=\"dot "+(i===0?"active":"")+"\"></span>"}).join("");var i=0;setInterval(function(){document.querySelectorAll(".slide")[i].classList.remove("active");document.querySelectorAll(".dot")[i].classList.remove("active");i=(i+1)%ts.length;document.querySelectorAll(".slide")[i].classList.add("active");document.querySelectorAll(".dot")[i].classList.add("active")},7000)}).catch(showError)}
</script><script src="/assets/live-slideshow.js"></script></body></html>
